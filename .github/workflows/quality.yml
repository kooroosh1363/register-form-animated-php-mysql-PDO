name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: verification_demo
          MYSQL_USER: verification_app
          MYSQL_PASSWORD: verification_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, mbstring
          coverage: none
      - name: Lint PHP
        run: find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run SQLite and MySQL verification tests
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=verification_demo;charset=utf8mb4
          TEST_MYSQL_USER: verification_app
          TEST_MYSQL_PASSWORD: verification_password
        run: php tests/run.php
